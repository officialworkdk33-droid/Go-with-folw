services:
  - type: web
    name: hawb-document-merger
    runtime: docker
    plan: starter
    dockerfilePath: ./Dockerfile
    envVars:
      - key: ALLOW_FOLDER_SCAN
        value: "false"
      - key: APP_ACCESS_CODE
        sync: false          # set this in the Render dashboard, not in git
      - key: MAX_FILES_PER_SCAN
        value: "150"
      - key: MAX_UPLOAD_MB
        value: "150"
      - key: SESSION_TTL_HOURS
        value: "6"
    healthCheckPath: /api/health
